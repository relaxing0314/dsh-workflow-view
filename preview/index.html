<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>工作流 preview</title>
    <style>
      html, body, #app { height: 100%; margin: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB",
          "Microsoft YaHei", sans-serif;
        background: var(--dsw-alias-bg-layer-1);
      }
      /* The real DSH theme aliases, copied from
         packages/client/ui-theme/src/styles/design-platform.css so the preview
         measures the same colours the product does. Dark mode is the theme that
         exposed the status-contrast bug, so both themes are defined here. */
      :root {
        --dsw-static-neutral-bluish-00: rgb(255, 255, 255);
        --dsw-static-neutral-bluish-50: rgb(249, 250, 251);
        --dsw-static-neutral-bluish-600: rgb(139, 143, 148);
        --dsw-static-neutral-bluish-700: rgb(86, 89, 93);
        --dsw-static-neutral-bluish-850: rgb(44, 44, 46);
        --dsw-static-neutral-bluish-875: rgb(35, 35, 36);
        --dsw-static-neutral-bluish-900: rgb(27, 27, 28);
        --dsw-static-neutral-bluish-950: rgb(21, 21, 23);
        --dsw-static-neutral-bluish-1000: rgb(15, 17, 21);
        --dsw-static-deepseek-100: rgb(228, 237, 253);
        --dsw-static-deepseek-400: rgb(103, 158, 254);
        --dsw-static-deepseek-500: rgb(65, 118, 230);
        --dsw-static-deepseek-800: rgb(52, 65, 91);
        --dsw-static-green-100: rgb(230, 250, 237);
        --dsw-static-green-400: rgb(78, 209, 126);
        --dsw-static-green-500: rgb(34, 197, 94);
        --dsw-static-green-900: rgb(35, 60, 44);
        --dsw-static-amber-100: rgb(254, 245, 231);
        --dsw-static-amber-500: rgb(245, 158, 11);
        --dsw-static-amber-900: rgb(39, 36, 31);
        --dsw-static-red-400: rgb(242, 90, 90);
        --dsw-static-red-600: rgb(236, 19, 19);

        --dsw-alias-bg-base: var(--dsw-static-neutral-bluish-00);
        --dsw-alias-bg-layer-1: var(--dsw-static-neutral-bluish-00);
        --dsw-alias-bg-layer-2: var(--dsw-static-neutral-bluish-00);
        --dsw-alias-bg-layer-3: var(--dsw-static-neutral-bluish-50);
        --dsw-alias-bg-module-platform: var(--dsw-static-neutral-bluish-50);
        --dsw-alias-label-primary: var(--dsw-static-neutral-bluish-1000);
        --dsw-alias-label-secondary: var(--dsw-static-neutral-bluish-700);
        --dsw-alias-label-tertiary: var(--dsw-static-neutral-bluish-600);
        --dsw-alias-label-caption: var(--dsw-static-neutral-bluish-600);
        --dsw-alias-border-l1: rgba(0, 0, 0, 0.04);
        --dsw-alias-border-l2: rgba(0, 0, 0, 0.1);
        --dsw-alias-border-l3: rgba(0, 0, 0, 0.16);
        --dsw-alias-border-l4: rgba(0, 0, 0, 0.24);
        --dsw-alias-interactive-bg-hover: rgba(38, 49, 72, 0.06);
        --dsw-alias-interactive-bg-hover-solid: rgb(241, 242, 244);
        --dsw-alias-state-business-primary: var(--dsw-static-deepseek-500);
        --dsw-alias-state-business-tertiary: var(--dsw-static-deepseek-100);
        --dsw-alias-state-success-primary: var(--dsw-static-green-500);
        --dsw-alias-state-success-tertiary: var(--dsw-static-green-100);        --dsw-alias-state-warn-primary: var(--dsw-static-amber-500);
        --dsw-alias-state-warn-tertiary: var(--dsw-static-amber-100);
        --dsw-alias-state-error-primary: var(--dsw-static-red-600);
        --dsw-alias-state-error-secondary: var(--dsw-static-red-400);
        --dsw-alias-markdown-code-block: var(--dsw-static-neutral-bluish-50);
        --dsw-alias-label-primary-bluish: var(--dsw-static-deepseek-800);
      }
      :root[data-theme='dark'] {
        --dsw-alias-bg-base: var(--dsw-static-neutral-bluish-950);
        --dsw-alias-bg-layer-1: var(--dsw-static-neutral-bluish-875);
        --dsw-alias-bg-layer-2: var(--dsw-static-neutral-bluish-850);
        --dsw-alias-bg-layer-3: var(--dsw-static-neutral-bluish-850);
        --dsw-alias-bg-module-platform: var(--dsw-static-neutral-bluish-850);
        --dsw-alias-label-primary: var(--dsw-static-neutral-bluish-50);
        --dsw-alias-label-secondary: rgb(163, 167, 172);
        --dsw-alias-label-tertiary: rgb(139, 143, 148);
        --dsw-alias-label-caption: rgb(139, 143, 148);
        --dsw-alias-border-l1: rgba(255, 255, 255, 0.06);
        --dsw-alias-border-l2: rgba(255, 255, 255, 0.12);
        --dsw-alias-border-l3: rgba(255, 255, 255, 0.2);
        --dsw-alias-border-l4: rgba(255, 255, 255, 0.28);
        --dsw-alias-interactive-bg-hover: rgba(255, 255, 255, 0.08);
        --dsw-alias-interactive-bg-hover-solid: rgb(52, 52, 54);
        /* The dark theme re-points the business and error hues; the error
           primary/secondary collapse onto the SAME value here, which is exactly
           what made the failed-round badge invisible before the derived tokens. */
        --dsw-alias-state-business-primary: var(--dsw-static-deepseek-400);
        --dsw-alias-state-business-tertiary: var(--dsw-static-deepseek-800);
        --dsw-alias-state-success-tertiary: rgb(35, 60, 44);
        --dsw-alias-state-warn-tertiary: rgb(39, 36, 31);
        --dsw-alias-state-error-primary: var(--dsw-static-red-400);
        --dsw-alias-state-error-secondary: var(--dsw-static-red-400);
        --dsw-alias-markdown-code-block: var(--dsw-static-neutral-bluish-900);
        --dsw-alias-label-primary-bluish: var(--dsw-static-deepseek-400);
      }
      .preview-shell { height: 100%; display: flex; flex-direction: column; }
      .preview-tabs {
        flex: 0 0 auto;
        display: flex;
        gap: 4px;
        padding: 8px 16px 0;
        border-bottom: 1px solid var(--dsw-alias-border-l2);
      }
      .preview-tab {
        padding: 6px 12px;
        font-size: 13px;
        color: var(--dsw-alias-label-secondary);
        border-bottom: 2px solid transparent;
        margin-bottom: -1px;
      }
      .preview-tab.is-active {
        color: var(--dsw-alias-label-primary);
        font-weight: 600;
        border-bottom-color: var(--dsw-alias-state-business-primary);
      }
      .preview-view { flex: 1 1 auto; min-height: 0; }
    </style>
    <script>
      // The module-loader handoff the harness page provides. Registration is
      // captured now; the preview driver calls the factory with a React shim.
      window.__ModuleLoader__ = {
        registrations: [],
        load(registration) { this.registrations.push(registration); },
      };
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script src="../lib/client.js"></script>
    <script type="module" src="./main.js"></script>
  </body>
</html>
