<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>工作流 preview</title>
    <style>
      html, body, #app { height: 100%; margin: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB",
          "Microsoft YaHei", sans-serif;
        background: var(--dsw-alias-bg-layer-1);
      }
      /* Minimal stand-ins for the DSH theme aliases the plugin reads. */
      :root {
        --dsw-alias-bg-base: #ffffff;
        --dsw-alias-bg-layer-1: #ffffff;
        --dsw-alias-bg-layer-2: #f5f6f7;
        --dsw-alias-bg-layer-3: #eceef0;
        --dsw-alias-bg-module-platform: #eceef0;
        --dsw-alias-label-primary: #1b1d1f;
        --dsw-alias-label-secondary: #56595d;
        --dsw-alias-label-tertiary: #8b8f94;
        --dsw-alias-label-caption: #a3a7ac;
        --dsw-alias-border-l1: #eceef0;
        --dsw-alias-border-l2: #e0e2e5;
        --dsw-alias-border-l3: #c9ccd0;
        --dsw-alias-border-l4: #b0b4b9;
        --dsw-alias-interactive-bg-hover: rgba(0, 0, 0, 0.04);
        --dsw-alias-interactive-bg-hover-solid: #f1f2f4;
        --dsw-alias-state-business-primary: #4d6bfe;
        --dsw-alias-state-business-tertiary: rgba(77, 107, 254, 0.1);
        --dsw-alias-state-success-primary: #12a150;
        --dsw-alias-state-success-tertiary: rgba(18, 161, 80, 0.1);
        --dsw-alias-state-warn-primary: #b26a00;
        --dsw-alias-state-warn-tertiary: rgba(178, 106, 0, 0.1);
        --dsw-alias-state-error-primary: #d93a3a;
        --dsw-alias-state-error-secondary: rgba(217, 58, 58, 0.1);
        --dsw-alias-markdown-code-block: #f5f6f7;
        --dsw-alias-label-primary-bluish: #2b3a8f;
      }
      .preview-shell { height: 100%; display: flex; flex-direction: column; }
      .preview-tabs {
        flex: 0 0 auto;
        display: flex;
        gap: 4px;
        padding: 8px 16px 0;
        border-bottom: 1px solid var(--dsw-alias-border-l2);
      }
      .preview-tab {
        padding: 6px 12px;
        font-size: 13px;
        color: var(--dsw-alias-label-secondary);
        border-bottom: 2px solid transparent;
        margin-bottom: -1px;
      }
      .preview-tab.is-active {
        color: var(--dsw-alias-label-primary);
        font-weight: 600;
        border-bottom-color: var(--dsw-alias-state-business-primary);
      }
      .preview-view { flex: 1 1 auto; min-height: 0; }
    </style>
    <script>
      // The module-loader handoff the harness page provides. Registration is
      // captured now; the preview driver calls the factory with a React shim.
      window.__ModuleLoader__ = {
        registrations: [],
        load(registration) { this.registrations.push(registration); },
      };
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script src="../lib/client.js"></script>
    <script type="module" src="./main.js"></script>
  </body>
</html>
